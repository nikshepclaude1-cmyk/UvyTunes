name: Android CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uvytunes-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > uvytunes-release.jks
          echo "storeFile=uvytunes-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        else
          keytool -genkeypair -v -keystore uvytunes-release.jks -alias uvytunes \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass uvypassword -keypass uvypassword \
            -dname "CN=UvyTunes, OU=Dev, O=UvyTunes, L=Unknown, ST=Unknown, C=US"
          echo "storeFile=uvytunes-release.jks" > keystore.properties
          echo "storePassword=uvypassword" >> keystore.properties
          echo "keyAlias=uvytunes" >> keystore.properties
          echo "keyPassword=uvypassword" >> keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: List built APKs
      run: find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

    - name: Collect APKs
      id: collect
      run: |
        mkdir -p release-apks
        find app/build/outputs/apk -name "*.apk" -exec cp {} release-apks/ \;
        cd release-apks
        ls -lh
        echo "files<<EOF" >> "$GITHUB_OUTPUT"
        ls *.apk >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: UvyTunes-APKs
        path: release-apks/*.apk

    - name: Get version
      id: version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed "s/.*\"\(.*\)\".*/\1/")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Building version: $VERSION"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: UvyTunes v${{ steps.version.outputs.version }}
        body: |
          ## UvyTunes v${{ steps.version.outputs.version }}

          ### What's New
          - SHORTS mode: iTunes preview playback
          - UvyTunes branding

          ### APK Variants
          - **Universal** - Works on all devices
          - **arm64-v8a** - For most modern phones (64-bit)
          - **armeabi-v7a** - For older phones (32-bit)

          ### Installation
          1. Download the APK for your device architecture
          2. Enable "Install from unknown sources" if prompted
          3. Install and enjoy!
        files: release-apks/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
