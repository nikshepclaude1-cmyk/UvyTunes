name: Android CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: uvytunes-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > uvytunes-release.jks
          echo "storeFile=uvytunes-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        else
          keytool -genkeypair -v -keystore uvytunes-release.jks -alias uvytunes \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass uvypassword -keypass uvypassword \
            -dname "CN=UvyTunes, OU=Dev, O=UvyTunes, L=Unknown, ST=Unknown, C=US"
          echo "storeFile=uvytunes-release.jks" > keystore.properties
          echo "storePassword=uvypassword" >> keystore.properties
          echo "keyAlias=uvytunes" >> keystore.properties
          echo "keyPassword=uvypassword" >> keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Prod Release APK (all ABIs)
      run: ./gradlew assembleProdRelease

    - name: Upload Universal APK
      uses: actions/upload-artifact@v4
      with:
        name: UvyTunes-universal
        path: app/build/outputs/apk/prod/release/*-universal.apk

    - name: Upload ARM64 APK
      uses: actions/upload-artifact@v4
      with:
        name: UvyTunes-arm64-v8a
        path: app/build/outputs/apk/prod/release/*-arm64-v8a.apk

    - name: Upload ARMv7 APK
      uses: actions/upload-artifact@v4
      with:
        name: UvyTunes-armeabi-v7a
        path: app/build/outputs/apk/prod/release/*-armeabi-v7a.apk
